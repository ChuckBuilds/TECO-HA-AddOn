name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, catches upstream rule changes
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  addon:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be repointed at
      # new code, which would run arbitrary steps with this workflow's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2
        with:
          path: "./teco_billing"

  python:
    name: Python compile + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff
      - name: Byte-compile all sources
        run: python -m compileall -q sidecar teco_billing/app
      - name: Ruff (non-blocking style report)
        run: ruff check sidecar || true

  authtests:
    name: Auth regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install runtime deps needed to import the app
        run: pip install fastapi 'httpx<1' beautifulsoup4 aiohttp playwright
      - name: The API must not be reachable without a token
        run: python tests/test_auth.py

  vendored:
    name: sidecar/ and add-on app/ in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail if ./sync.sh was not run
        run: |
          for f in teco_auth_sidecar.py ha_publish.py parsers.py models.py ibill.py webui.html requirements.txt; do
            if ! cmp -s "sidecar/$f" "teco_billing/app/$f"; then
              echo "::error file=sidecar/$f::sidecar/$f differs from teco_billing/app/$f — run ./sync.sh"
              exit 1
            fi
          done
          echo "all vendored files in sync"
