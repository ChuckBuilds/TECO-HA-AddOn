name: TECO Billing
version: "1.4.0"
slug: teco_billing
description: >-
  Pulls Tampa Electric (TECO) and Peoples Gas billing, usage, cost and
  service-period data into Home Assistant — feeds the Energy Dashboard (daily kWh + cost), creates sensors,
  and serves a billing dashboard. Logs into account.tecoenergy.com in a headless
  browser (handles reCAPTCHA v3 + Cloudflare) and keeps a persistent, never-purged
  archive of every bill.
url: https://github.com/ChuckBuilds/TECO-HA-AddOn
arch:
  - amd64
  - aarch64
init: false

# Talk to the HA Core API (push Energy Dashboard statistics + create sensor entities)
homeassistant_api: true

# --- side panel (ingress) -------------------------------------------------- #
ingress: true
ingress_port: 8089
panel_icon: mdi:transmission-tower-export
panel_title: TECO Billing

# --- optional external API port -------------------------------------------- #
# The add-on pushes data into HA itself, so this isn't needed for normal use.
# Exposed only for power users who want to hit /data, /export, etc. directly.
# Protected by auth_token if set (ingress is always exempt). Set to null to disable.
# NOT published by default. The add-on pushes to HA itself and the dashboard is
# served over ingress, so nothing needs this open. Publishing it puts the whole
# billing archive on your LAN -- set a port in the add-on's Network tab only if
# you want direct API access, and set auth_token when you do.
ports:
  8089/tcp: null
ports_description:
  8089/tcp: >-
    Direct API access (optional, off by default). Leave empty unless you need
    /data, /export or /bills from outside Home Assistant. Set auth_token too.

# --- persistent archive ---------------------------------------------------- #
# Add-ons get a persistent /data dir automatically; the bill cache lives in
# /data/cache and is never purged. Back up the add-on to preserve >3yr history.

# --- Configuration tab ----------------------------------------------------- #
options:
  teco_user: ""
  teco_pass: ""
  account_id: ""
  auth_token: ""
  backfill_bills: 36
  poll_interval_hours: 6
  sensor_refresh_min: 5
  setup_energy_dashboard: true
  grid_cost_from_teco: false
  session_ttl_min: 30
  log_level: info
schema:
  teco_user: str
  teco_pass: password
  account_id: str?
  auth_token: password?
  backfill_bills: int(1,120)
  poll_interval_hours: int(1,24)
  sensor_refresh_min: int(1,60)
  setup_energy_dashboard: bool
  grid_cost_from_teco: bool
  session_ttl_min: int(5,240)
  log_level: list(trace|debug|info|warning|error)
